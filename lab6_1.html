<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <title>Лабораторна робота - Варіант 16</title>
        <link rel="stylesheet" href="lab6_1.css">
    </head>
    <body>
        <h2>Шість блоків з випадковими кольорами</h2>
        <script>
            let output = '';
            for (let row = 0; row < 2; row++) {  
                output += '<div class="row">';  
                for (let i = 0; i < 3; i++) { 
                    let red = Math.floor(Math.random() * 256);
                    let green = Math.floor(Math.random() * 256);
                    let blue = Math.floor(Math.random() * 256);
                    output += `<div class="item" style="background-color: rgb(${red}, ${green}, ${blue});"></div>`; 
                }  
                output += '</div>'; 
            } 
            document.write(output);
        </script>
    </body>
</html>
